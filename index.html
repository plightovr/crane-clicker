<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>crane-clicker</title>
  </head>
  <body class="flex flex-col h-screen">
    <header class=" text-white italic text-5xl text-center">
      Crane Clicker
    </header>
    <main class="flex flex-1">
    <div class="flex-2">
      <p id="scoreDisplay" class="text-center text-white text-3xl font-mono mt-3">cargo</p>
      <button id="clicker">
        <img src="src/assets/crane.webp" class="ml-40 mt-30">
        <img src="src/assets/cargo.png" class="ml-80 mt-3 h-20">

        </button>
        </div>
        <div class="flex-1flex flex-col items-center">
          <button id="upgradeOne" class="flex transition-all text-white">Upgrade 1</button>
          <button>
            <img src="src/assets/hook.png" class="h-30 text-white"> <p id="upgradeOneCount">0 Additional Hooks</p> <p class="text-xl text-white"> 112 cargo</p>
          </button>
          <button id="upgradeTwo" text-white class="flex transition-all text-white">Upgrade 2</button>
          <button>
            <img src="src/assets/anc.png" class="h-50 text-white"> <p id="upgradeTwoCount">0 Big Red Hooks</p> <p class="text-xl text-white">730 cargo</p>
          </button>

        </div>
        <div class="flex-1 ">

        </div>
        </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
